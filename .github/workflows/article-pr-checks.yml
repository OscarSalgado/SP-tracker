name: Article PR checks

on:
  pull_request:
    paths:
      - "articles/**"
      - "taxonomy.yaml"
      - "scripts/validate_article.py"
      - "requirements-dev.txt"

jobs:
  detect-changed:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: detect
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json
          import subprocess

          base = "origin/${{ github.base_ref }}"
          diff = subprocess.run(
              ["git", "diff", "--name-only", f"{base}...HEAD"],
              capture_output=True, text=True, check=True,
          ).stdout.splitlines()

          dirs = sorted({
              "/".join(f.split("/")[:2])
              for f in diff
              if f.startswith("articles/") and len(f.split("/")) >= 2
          })
          print(f"matrix={json.dumps(dirs)}")
          EOF

  validate:
    needs: detect-changed
    if: needs.detect-changed.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        article: ${{ fromJson(needs.detect-changed.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar herramientas de validación
        run: pip install -r requirements-dev.txt

      - name: Instalar dependencias del artículo (si existen)
        run: |
          if [ -f "${{ matrix.article }}/requirements.txt" ]; then
            pip install -r "${{ matrix.article }}/requirements.txt"
          fi

      - name: Validar artículo
        run: python scripts/validate_article.py "${{ matrix.article }}"

  gate:
    name: gate
    needs: [detect-changed, validate]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Comprobar resultado de los jobs anteriores
        run: |
          detect="${{ needs.detect-changed.result }}"
          validate="${{ needs.validate.result }}"
          echo "detect-changed: $detect"
          echo "validate: $validate"

          if [ "$detect" != "success" ]; then
            echo "detect-changed no tuvo éxito."
            exit 1
          fi

          # 'skipped' es válido: significa que ningún artículo cambió en este PR.
          if [ "$validate" != "success" ] && [ "$validate" != "skipped" ]; then
            echo "Algún artículo no pasó la validación."
            exit 1
          fi

          echo "Todos los artículos tocados son válidos (o no había ninguno)."
